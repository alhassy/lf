name: lf CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Emacs
        uses: purcell/setup-emacs@v8.0
        with:
          version: 30.1

      - name: Install dependencies from MELPA
        run: |
          emacs --batch --eval '(progn
            (require (quote package))
            (add-to-list (quote package-archives)
                         (quote ("melpa" . "https://melpa.org/packages/")))
            (package-initialize)
            (package-refresh-contents)
            (dolist (pkg (quote (s cl-lib dash seq)))
              (unless (package-installed-p pkg)
                (package-install pkg))))'

      - name: Fetch snap, which the tests are written with
        run: |
          git clone --depth 1 https://github.com/alhassy/snap ~/snap
          git clone --depth 1 https://github.com/alhassy/fancy-C-x-C-e ~/fancy-C-x-C-e

      - name: Byte-compile
        run: |
          emacs --batch \
            --eval '(package-initialize)' \
            -L . \
            -f batch-byte-compile \
            lf.el

      - name: Run ERT tests
        run: |
          emacs --batch \
            --eval '(package-initialize)' \
            -L . -L ~/snap -L ~/fancy-C-x-C-e \
            $(for f in tests/*-tests.el; do echo "-l $f"; done) \
            -f ert-run-tests-batch-and-exit
